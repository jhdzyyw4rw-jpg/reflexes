<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attrape le carré !</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px; font-family: Arial, sans-serif; color: #20243a;
      background: linear-gradient(-45deg, #a7e8ff, #c8b7ff, #ffd4ec, #b8f5e2);
      background-size: 400% 400%; animation: backgroundMove 12s ease infinite;
    }
    @keyframes backgroundMove { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    .game {
      width: min(92vw, 650px); padding: 30px; text-align: center;
      background: rgba(255,255,255,.84); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.8); border-radius: 26px;
      box-shadow: 0 20px 60px #34345a30; animation: appear .7s ease both;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 5vw, 2.2rem); }
    p { color: #60657c; }
    .best-score { margin: 18px 0 0; text-align: left; font-weight: bold; color: #20243a; }
    .stats { display: flex; justify-content: center; gap: 32px; margin: 22px 0; font-size: 1.1rem; font-weight: bold; }
    .stats div { padding: 10px 16px; border-radius: 12px; background: #f0edff; }
    .arena {
      position: relative; height: 300px; overflow: hidden; border: 3px solid #e5e0ff;
      border-radius: 18px; background: linear-gradient(135deg, #f8f7ff, #edfaff);
      box-shadow: inset 0 0 25px #9d8cff18; transition: box-shadow .2s;
    }
    .arena.flash { box-shadow: inset 0 0 35px #a78bfa70; }
    #target {
      position: absolute; display: none; width: 48px; height: 48px; border: 0; border-radius: 12px;
      background: linear-gradient(135deg, #9b7bff, #633de0); cursor: pointer;
      box-shadow: 0 6px 18px #7457ee70, 0 0 0 5px #8b6bff20;
      animation: targetPulse 1.2s ease-in-out infinite alternate;
      transition: transform .12s, filter .12s, left .12s, top .12s;
    }
    #target:hover { transform: scale(1.13) rotate(7deg); filter: brightness(1.15); }
    #target:active { transform: scale(.85); }
    @keyframes targetPulse { from { box-shadow: 0 5px 14px #7457ee60, 0 0 0 4px #8b6bff18; } to { box-shadow: 0 7px 24px #7457eea0, 0 0 0 9px #8b6bff08; } }
    .particle { position: absolute; z-index: 2; width: 9px; height: 9px; border-radius: 50%; background: var(--particle-color); pointer-events: none; animation: burst .48s ease-out forwards; }
    @keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(.1); opacity: 0; } }
    button.start, .menu-button {
      margin-top: 20px; padding: 14px 30px; border: 0; border-radius: 14px; color: white;
      background: linear-gradient(135deg, #292d50, #6046bd); font-size: 1rem; font-weight: bold;
      cursor: pointer; box-shadow: 0 7px 18px #39305f40; transition: transform .18s, box-shadow .18s, filter .18s;
    }
    button.start:hover, .menu-button:hover { transform: translateY(-3px); box-shadow: 0 11px 22px #39305f55; filter: brightness(1.12); }
    button.start:active, .menu-button:active { transform: translateY(1px) scale(.98); }
    #message { min-height: 24px; font-weight: bold; }
    .game-wrap { position: relative; width: min(92vw, 650px); }
    .game { width: 100%; }
    .game.blurred { filter: blur(5px); transform: scale(.985); pointer-events: none; user-select: none; }
    .menu-overlay {
      position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
      padding: 18px; border-radius: 26px; background: rgba(22, 20, 45, .28);
      backdrop-filter: blur(5px); animation: appear .35s ease both;
    }
    .menu-panel {
      width: min(100%, 440px); padding: 28px 24px; border-radius: 24px; text-align: center;
      color: #20243a; background: rgba(255,255,255,.96);
      box-shadow: 0 18px 55px #17132f55; border: 1px solid white;
    }
    .menu-panel h2 { margin: 0 0 8px; font-size: 1.8rem; }
    .menu-panel p { margin: 8px 0 20px; }
    .difficulty-list { display: grid; gap: 10px; }
    .difficulty {
      width: 100%; padding: 13px 16px; border: 2px solid transparent; border-radius: 13px;
      background: #f0edff; color: #292747; font-size: 1rem; font-weight: bold; cursor: pointer;
      transition: transform .15s, border-color .15s, background .15s;
    }
    .difficulty:hover { transform: translateY(-2px); background: #e6dfff; }
    .difficulty.selected { border-color: #7457ee; background: #e7e0ff; box-shadow: 0 0 0 3px #7457ee20; }
    .difficulty small { display: block; margin-top: 4px; font-size: .82rem; font-weight: normal; color: #66627e; }
    .menu-button { width: 100%; margin-top: 18px; }
    .mode-label { font-size: .9rem; color: #6b5bd2; font-weight: bold; }
    @media (max-width: 480px) {
      .game { padding: 20px 15px; } .stats { gap: 10px; font-size: 1rem; }
      .stats div { padding: 9px 11px; } .arena { height: 260px; }
      .menu-panel { padding: 23px 17px; } .menu-panel h2 { font-size: 1.55rem; }
    }
    /* Indicateur de destination du niveau Hard */
    #warningMarker {
      position: absolute; z-index: 4; display: none; width: 48px; height: 48px;
      align-items: center; justify-content: center; border: 2px dashed #e59b00;
      border-radius: 12px; background: #fff3b8bb; color: #9a5a00;
      font-size: 30px; pointer-events: none; animation: warning-pulse .35s ease-in-out infinite alternate;
    }
    @keyframes warning-pulse { from { opacity: .55; transform: scale(.86); } to { opacity: 1; transform: scale(1.08); } }

    /* Traînée de souris contrastée automatiquement avec chaque fond */
    .cursor-trail {
      position: absolute; z-index: 20; width: 11px; height: 11px; border-radius: 50%;
      background: #fff; mix-blend-mode: difference; pointer-events: none;
      transform: translate(-50%, -50%); animation: trail-fade .42s ease-out forwards;
    }
    @keyframes trail-fade {
      from { opacity: .95; scale: 1; }
      to { opacity: 0; scale: .15; }
    }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  
    /* Mode impossible : trois manches */
    .round-label { margin: 0 0 10px; color: #7655d9; font-weight: 800; }
    .impossible-cube {
      position: absolute; z-index: 3; width: 42px; height: 42px; padding: 0;
      border: 0; border-radius: 10px; cursor: pointer;
      background: linear-gradient(135deg, #9b7bff, #633de0);
      box-shadow: 0 5px 18px #7457ee80;
      animation: cube-pop .16s ease-out both;
    }
    @keyframes cube-pop { from { opacity: 0; transform: scale(.2) rotate(-25deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    .impossible-cube.moving { animation: cube-pop .16s ease-out both, cube-drift .42s ease-in-out infinite alternate; }
    @keyframes cube-drift { from { translate: -8px 5px; } to { translate: 9px -7px; } }
    .impossible-cube.leaving { animation: cube-out .12s ease-in forwards; pointer-events: none; }
    @keyframes cube-out { to { opacity: 0; transform: scale(.25) rotate(35deg); } }
    .arena.hell {
      border-color: #ff4545;
      background: radial-gradient(ellipse at bottom, #8e1717 0%, #35101a 58%, #180e1d 100%);
      box-shadow: inset 0 0 35px #ff252580, 0 0 18px #ff252550;
    }
    .arena.hell::before {
      content: ""; position: absolute; z-index: 0; inset: 0; pointer-events: none;
      opacity: .85; background:
        radial-gradient(ellipse at 12% 100%, #ffb000 0%, #ff4d00 18%, transparent 48%),
        radial-gradient(ellipse at 48% 110%, #ffdf55 0%, #ff3b00 24%, transparent 52%),
        radial-gradient(ellipse at 88% 105%, #ff9a00 0%, #e21b00 23%, transparent 50%);
      background-size: 150% 150%; animation: flames-wave .75s ease-in-out infinite alternate;
    }
    @keyframes flames-wave { from { transform: scaleY(.78); filter: brightness(.8); } to { transform: scaleY(1.15); filter: brightness(1.35); } }
    .arena.hell .impossible-cube { background: linear-gradient(135deg, #ff7777, #c40018); box-shadow: 0 0 16px #ff2424, 0 0 0 3px #ff777744; }
    .arena.shake { animation: arena-shake .11s linear infinite; }
    @keyframes arena-shake { 0% { transform: translate(0,0); } 25% { transform: translate(2px,-1px); } 50% { transform: translate(-2px,1px); } 75% { transform: translate(1px,2px); } 100% { transform: translate(-1px,-2px); } }
    .arena.hell + .start { background: linear-gradient(135deg, #8b0000, #ed2929); }

      .arena.hell .round-label { position: relative; z-index: 2; color: white; text-shadow: 0 1px 5px #000; }

    .round-announcement {
      position: absolute; z-index: 10; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 18px; color: white; font-size: clamp(2rem, 8vw, 3.8rem); font-weight: 900;
      text-align: center; text-transform: uppercase; letter-spacing: 1px;
      text-shadow: 0 4px 18px #211044; background: #21104455;
      pointer-events: none; animation: round-banner 1.35s ease both;
    }
    .arena.hell .round-announcement { color: #fff; text-shadow: 0 3px 18px #ff1717, 0 0 30px #ff1717; background: #40000066; }
    @keyframes round-banner {
      0% { opacity: 0; transform: scale(.65); }
      18%, 72% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.12); }
    }

    .required-score { margin: -8px 0 14px; font-weight: 800; color: #5c48b8; }
    .difficulty:disabled { opacity: .42; cursor: not-allowed; filter: grayscale(.8); transform: none; box-shadow: none; }
    .difficulty:disabled:hover { background: #f0edff; }
    #message.eliminated-message { color: #d00020; font-size: clamp(1.8rem, 6vw, 2.7rem); font-weight: 900; line-height: 1.1; }
    #message.eliminated-message small { display: block; margin-top: 8px; color: #7b2430; font-size: .85rem; font-weight: 600; }
</style>
</head>
<body>
  <div class="game-wrap">
    <main class="game blurred" id="game">
      <h1>🎯 Attrape le carré !</h1>
      <p>Clique sur le carré violet le plus vite possible en 30 secondes.</p>
      <p class="best-score">🏆 Meilleur score : <span id="best">0</span></p>
      <div class="stats">
        <div>Score : <span id="score">0</span></div>
        <div>Temps : <span id="time">30</span> s</div>
      </div>
      <p class="required-score" id="requiredScore">Score requis pour changer de niveau : 0/10 cubes</p>
      <div class="arena" id="arena">
        <div class="round-label" id="roundLabel" style="display:none"></div>
        <div id="warningMarker" aria-hidden="true">⚠️</div>
        <button id="target" aria-label="Carré à attraper"></button>
      </div>
      <button class="start" id="start">Commencer</button>
      <p id="message">Prêt à tester tes réflexes ?</p>
      <p class="mode-label" id="modeLabel">Mode : aucun</p>
    </main>

    <section class="menu-overlay" id="menu">
      <div class="menu-panel">
        <h2>⚡ Choisis ton niveau</h2>
        <p>Jusqu'où iront tes réflexes ?</p>
        <div class="difficulty-list">
          <button class="difficulty selected" data-mode="easy">🟢 Facile<small>Le carré bouge lentement</small></button>
          <button class="difficulty" data-mode="medium">🟡 Moyen<small>Le carré bouge plus vite</small></button>
          <button class="difficulty" data-mode="hard">🔴 Hard<small>Le carré est très rapide !</small></button>
          <button class="difficulty" data-mode="impossible">💀 Impossible<small>Il se téléporte toutes les 1 seconde !</small></button>
        </div>
        <button class="menu-button" id="play">JOUER</button>
      </div>
    </section>
  </div>

  <script>
    const arena = document.getElementById('arena');
    const target = document.getElementById('target');
    const warningMarker = document.getElementById('warningMarker');
    const scoreText = document.getElementById('score');
    const timeText = document.getElementById('time');
    const bestText = document.getElementById('best');
    const message = document.getElementById('message');
    const startButton = document.getElementById('start');
    const menu = document.getElementById('menu');
    const game = document.getElementById('game');
    const playButton = document.getElementById('play');
    const modeLabel = document.getElementById('modeLabel');
    const roundLabel = document.getElementById('roundLabel');
    const requiredScoreText = document.getElementById('requiredScore');
    // La traînée utilise le mode « difference » : elle s'inverse visuellement
    // selon la couleur du décor (claire dans l'arène sombre, sombre sur fond clair).
    arena.addEventListener('pointermove', event => {
      if (event.pointerType && event.pointerType !== 'mouse') return;
      const rect = arena.getBoundingClientRect();
      const dot = document.createElement('span');
      dot.className = 'cursor-trail';
      dot.style.left = (event.clientX - rect.left) + 'px';
      dot.style.top = (event.clientY - rect.top) + 'px';
      arena.appendChild(dot);
      dot.addEventListener('animationend', () => dot.remove(), { once: true });
    });
    let announcementTimer = null;
    function showRoundAnnouncement() {
      const oldBanner = arena.querySelector('.round-announcement');
      if (oldBanner) oldBanner.remove();
      clearTimeout(announcementTimer);
      const banner = document.createElement('div');
      banner.className = 'round-announcement';
      banner.textContent = 'NOUVELLE MANCHE !';
      arena.appendChild(banner);
      announcementTimer = setTimeout(() => banner.remove(), 1400);
    }

    const modes = {
      easy: { name: 'Facile', speed: 3000 },
      medium: { name: 'Moyen', speed: 1000 },
      hard: { name: 'Hard', speed: 500 },
      impossible: { name: 'Impossible', speed: 1000 }
    };
    const modeOrder = ['easy', 'medium', 'hard', 'impossible'];
    let unlockedLevel = Math.max(0, Math.min(3, Number(localStorage.getItem('reflexes-unlocked-level') || 0)));
    let selectedMode = modeOrder[unlockedLevel];
    let score = 0;
    let timeLeft = 30;
    let timer = null;
    let moveTimer = null;
    let spawnTimer = null;
    let round = 1;
    let playing = false;
    let bestScore = Number(localStorage.getItem('reflexes-best-score') || 0);
    bestText.textContent = bestScore;

    function requiredForMode(mode) {
      return mode === 'impossible' ? 100 : 10;
    }

    function updateRequiredScore() {
      const required = requiredForMode(selectedMode);
      requiredScoreText.textContent = 'Score requis pour changer de niveau : ' + Math.min(score, required) + '/' + required + ' cubes';
    }

    function renderDifficultyMenu() {
      document.querySelectorAll('.difficulty').forEach((button, index) => {
        const locked = index > unlockedLevel;
        button.disabled = locked;
        button.classList.toggle('selected', button.dataset.mode === selectedMode);
        const small = button.querySelector('small');
        if (locked) small.textContent = '🔒 Niveau verrouillé';
        else if (button.dataset.mode === 'impossible') small.textContent = 'Atteins 100 cubes en 30 secondes !';
        else small.textContent = 'Atteins 10 cubes pour débloquer le niveau suivant';
      });
      updateRequiredScore();
    }

    function moveTarget() {
      const maxX = Math.max(0, arena.clientWidth - target.offsetWidth);
      const maxY = Math.max(0, arena.clientHeight - target.offsetHeight);
      const nextX = Math.floor(Math.random() * (maxX + 1));
      const nextY = Math.floor(Math.random() * (maxY + 1));
      if (playing && selectedMode === 'hard') {
        // Le symbole annonce exactement la prochaine position du carré.
        warningMarker.style.left = nextX + 'px';
        warningMarker.style.top = nextY + 'px';
        warningMarker.style.display = 'flex';
        clearTimeout(warningMarker._moveTimer);
        warningMarker._moveTimer = setTimeout(() => {
          if (!playing || selectedMode !== 'hard') return;
          target.style.left = nextX + 'px';
          target.style.top = nextY + 'px';
          warningMarker.style.display = 'none';
        }, 300);
      } else {
        warningMarker.style.display = 'none';
        target.style.left = nextX + 'px';
        target.style.top = nextY + 'px';
      }
    }

    function clearImpossibleCubes() {
      arena.querySelectorAll('.impossible-cube').forEach(cube => {
        if (cube._teleportTimer) clearInterval(cube._teleportTimer);
        cube.remove();
      });
    }

    function setRound(nextRound) {
      round = nextRound;
      roundLabel.style.display = 'block';
      roundLabel.textContent = 'MANCHE ' + round + ' / 3';
      showRoundAnnouncement();
      if (round === 1) {
        message.textContent = 'Manche 1 : attrape les carrés !';
        arena.classList.remove('hell', 'shake');
      } else if (round === 2) {
        message.textContent = 'Manche 2 : ils disparaissent plus vite !';
        arena.classList.remove('hell', 'shake');
      } else {
        message.textContent = '🔥 MANCHE 3 : bienvenue en enfer !';
        arena.classList.add('hell', 'shake');
      }
      clearImpossibleCubes();
    }

    function spawnImpossibleCube() {
      if (!playing || selectedMode !== 'impossible') return;
      const cube = document.createElement('button');
      cube.className = 'impossible-cube';
      cube.setAttribute('aria-label', 'Carré à attraper');
      const size = round === 3 ? 38 : 42;
      cube.style.width = size + 'px';
      cube.style.height = size + 'px';
      const maxX = Math.max(0, arena.clientWidth - size);
      const maxY = Math.max(0, arena.clientHeight - size);
      const place = () => {
        cube.style.left = Math.floor(Math.random() * (maxX + 1)) + 'px';
        cube.style.top = Math.floor(Math.random() * (maxY + 1)) + 'px';
      };
      place();
      if (round === 3 && Math.random() < 0.5) {
        cube.classList.add('moving');
      } else if (round === 3) {
        cube._teleportTimer = setInterval(place, 125);
      }
      arena.appendChild(cube);
      cube.addEventListener('click', () => {
        if (!playing || !cube.isConnected) return;
        score++;
        scoreText.textContent = score;
        updateRequiredScore();
        clickEffectAt(cube.offsetLeft + size / 2, cube.offsetTop + size / 2, round === 3);
        cube.classList.add('leaving');
        setTimeout(() => {
          if (cube._teleportTimer) clearInterval(cube._teleportTimer);
          cube.remove();
        }, 120);
      });
      const lifetime = round === 1 ? 1000 : round === 2 ? 750 : 500;
      setTimeout(() => {
        if (cube._teleportTimer) clearInterval(cube._teleportTimer);
        if (cube.isConnected) {
          cube.classList.add('leaving');
          setTimeout(() => cube.remove(), 120);
        }
      }, lifetime);
    }

    function hiddenTeleport() {
      target.style.display = 'none';
      setTimeout(() => {
        if (!playing) return;
        moveTarget();
        target.style.display = 'block';
      }, 180);
    }

    function clickEffectAt(centerX, centerY, red) {
      const colors = red ? ['#ff3434', '#ffb000', '#fff06a'] : ['#8b5cf6', '#ec4899', '#06b6d4', '#f59e0b'];
      for (let i = 0; i < 10; i++) {
        const particle = document.createElement('span');
        const angle = (Math.PI * 2 * i) / 10;
        const distance = 28 + Math.random() * 24;
        particle.className = 'particle';
        particle.style.left = centerX + 'px';
        particle.style.top = centerY + 'px';
        particle.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
        particle.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
        particle.style.setProperty('--particle-color', colors[i % colors.length]);
        arena.appendChild(particle);
        particle.addEventListener('animationend', () => particle.remove());
      }
      arena.classList.add('flash');
      setTimeout(() => arena.classList.remove('flash'), 160);
    }

    function clickEffect() {
      clickEffectAt(target.offsetLeft + target.offsetWidth / 2, target.offsetTop + target.offsetHeight / 2, false);
    }

    function stopTimers() {
      clearInterval(timer);
      clearInterval(moveTimer);
      clearInterval(spawnTimer);
      timer = moveTimer = spawnTimer = null;
    }

    function showMenu() {
      stopTimers();
      playing = false;
      target.style.display = 'none';
      warningMarker.style.display = 'none';
      clearTimeout(warningMarker._moveTimer);
      clearImpossibleCubes();
      arena.classList.remove('hell', 'shake');
      roundLabel.style.display = 'none';
      menu.style.display = 'flex';
      game.classList.add('blurred');
    }

    function endGame() {
      playing = false;
      stopTimers();
      target.style.display = 'none';
      warningMarker.style.display = 'none';
      clearTimeout(warningMarker._moveTimer);
      clearImpossibleCubes();
      arena.classList.remove('hell', 'shake');
      startButton.textContent = 'Rejouer';
      const required = requiredForMode(selectedMode);

      if (score >= required) {
        if (selectedMode === 'impossible') {
          message.classList.remove('eliminated-message');
          message.textContent = '🏆 INCROYABLE ! Tu as réussi le niveau impossible !';
        } else {
          const currentIndex = modeOrder.indexOf(selectedMode);
          unlockedLevel = Math.max(unlockedLevel, currentIndex + 1);
          localStorage.setItem('reflexes-unlocked-level', String(unlockedLevel));
          selectedMode = modeOrder[unlockedLevel];
          message.classList.remove('eliminated-message');
          message.textContent = '🎉 Niveau débloqué ! Tu passes au niveau ' + modes[selectedMode].name + ' !';
          renderDifficultyMenu();
        }
      } else if (selectedMode === 'impossible') {
        message.classList.add('eliminated-message');
        message.innerHTML = '<span>ÉLIMINÉ</span><small>Tu n\'as jamais eu le niveau</small>';
      } else {
        message.classList.remove('eliminated-message');
        message.textContent = '⏰ Pas assez de cubes ! Il fallait ' + required + '. Réessaie le niveau ' + modes[selectedMode].name + '.';
      }
      setTimeout(showMenu, 2200);
    }

    document.querySelectorAll('.difficulty').forEach(button => {
      button.addEventListener('click', () => {
        if (button.disabled) return;
        selectedMode = button.dataset.mode;
        renderDifficultyMenu();
      });
    });

    function startGame() {
      stopTimers();
      clearImpossibleCubes();
      arena.classList.remove('hell', 'shake');
      roundLabel.style.display = 'none';
      score = 0;
      timeLeft = 30;
      round = 1;
      playing = true;
      scoreText.textContent = score;
      timeText.textContent = timeLeft;
      message.classList.remove('eliminated-message');
      message.textContent = "C'est parti ! Clique sur le carré !";
      updateRequiredScore();
      modeLabel.textContent = 'Mode : ' + modes[selectedMode].name;
      startButton.textContent = 'Recommencer';
      menu.style.display = 'none';
      game.classList.remove('blurred');

      warningMarker.style.display = 'none';
      clearTimeout(warningMarker._moveTimer);
      if (selectedMode === 'impossible') {
        target.style.display = 'none';
        setRound(1);
        spawnImpossibleCube();
        spawnTimer = setInterval(spawnImpossibleCube, 390);
        timer = setInterval(() => {
          timeLeft--;
          timeText.textContent = timeLeft;
          if (timeLeft === 20) setRound(2);
          if (timeLeft === 10) setRound(3);
          if (timeLeft <= 0) endGame();
        }, 1000);
      } else {
        target.style.display = 'block';
        moveTarget();
        moveTimer = setInterval(moveTarget, modes[selectedMode].speed);
        timer = setInterval(() => {
          timeLeft--;
          timeText.textContent = timeLeft;
          if (timeLeft <= 0) endGame();
        }, 1000);
      }
    }

    renderDifficultyMenu();
    playButton.addEventListener('click', startGame);
    startButton.addEventListener('click', showMenu);

    target.addEventListener('click', () => {
      if (!playing || selectedMode === 'impossible') return;
      clickEffect();
      score++;
      scoreText.textContent = score;
      updateRequiredScore();
      moveTarget();
    });
  </script>
</body>
</html>
